name: Build Lean FFmpeg (Signature + HWAccel)

on:
  workflow_dispatch:
  push:
    branches: [ main,v1 ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # ---------- macOS ----------
      - name: Install build dependencies (macOS)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          brew install automake autoconf libtool pkg-config nasm

      - name: Configure FFmpeg (macOS shared)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          ./configure \
            --prefix=$(pwd)/out/macos/shared \
            --disable-everything \
            --enable-version3 \
            --enable-shared \
            \
            # Protocols
            --enable-protocol=file \
            --enable-protocol=pipe \
            \
            # Muxers (outputs)
            --enable-muxer=null \
            --enable-muxer=mp4 \
            --enable-muxer=asf \
            --enable-muxer=matroska \
            \
            # Demuxers (inputs)
            --enable-demuxer=mov,mp4,mpegts,asf,matroska \
            \
            # Parsers
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=aac \
            \
            # Decoders
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=aac \
            --enable-decoder=wmv1 \
            --enable-decoder=wmv2 \
            --enable-decoder=wmv3 \
            --enable-decoder=vc1 \
            --enable-decoder=wmav1 \
            --enable-decoder=wmav2 \
            --enable-decoder=wmapro \
            \
            # Filters
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-filter=color \
            --enable-filter=testsrc \
            --enable-filter=testsrc2 \
            \
            # Devices
            --enable-indev=lavfi \
            \
            # Optional: minimal encoder for MP4 test output
            --enable-encoder=mpeg4 \
            \
            --enable-videotoolbox \
            --disable-static \
            --disable-doc

      # ---------- Windows ----------
      - name: Set up MSVC
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2
        if: ${{ matrix.os == 'windows-latest' }}
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            yasm
            nasm
            pkg-config
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Configure FFmpeg (Windows MSYS2/MinGW)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          ./configure \
            --disable-everything \
            --enable-version3 \
            \
            # Protocols
            --enable-protocol=file \
            --enable-protocol=pipe \
            \
            # Muxers (outputs)
            --enable-muxer=null \
            --enable-muxer=mp4 \
            --enable-muxer=asf \
            --enable-muxer=matroska \
            \
            # Demuxers (inputs)
            --enable-demuxer=mov,mp4,mpegts,asf,matroska \
            \
            # Parsers
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=aac \
            \
            # Decoders
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=aac \
            --enable-decoder=wmv1 \
            --enable-decoder=wmv2 \
            --enable-decoder=wmv3 \
            --enable-decoder=vc1 \
            --enable-decoder=wmav1 \
            --enable-decoder=wmav2 \
            --enable-decoder=wmapro \
            \
            # Filters
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-filter=color \
            --enable-filter=testsrc \
            --enable-filter=testsrc2 \
            \
            # Devices
            --enable-indev=lavfi \
            \
            # Optional: minimal encoder for MP4 test output
            --enable-encoder=mpeg4 \
            \
            --disable-doc \
            --arch=x86_64 \
            --enable-cross-compile

      # ---------- Linux ----------
      - name: Install build dependencies (Linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git libtool pkg-config \
            yasm nasm

      - name: Configure FFmpeg (Linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          ./configure \
            --disable-everything \
            --enable-version3 \
            \
            # Protocols
            --enable-protocol=file \
            --enable-protocol=pipe \
            \
            # Muxers (outputs)
            --enable-muxer=null \
            --enable-muxer=mp4 \
            --enable-muxer=asf \
            --enable-muxer=matroska \
            \
            # Demuxers (inputs)
            --enable-demuxer=mov,mp4,mpegts,asf,matroska \
            \
            # Parsers
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=aac \
            \
            # Decoders
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=aac \
            --enable-decoder=wmv1 \
            --enable-decoder=wmv2 \
            --enable-decoder=wmv3 \
            --enable-decoder=vc1 \
            --enable-decoder=wmav1 \
            --enable-decoder=wmav2 \
            --enable-decoder=wmapro \
            \
            # Filters
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-filter=color \
            --enable-filter=testsrc \
            --enable-filter=testsrc2 \
            \
            # Devices
            --enable-indev=lavfi \
            \
            # Optional: minimal encoder for MP4 test output
            --enable-encoder=mpeg4 \
            \
            --disable-doc
