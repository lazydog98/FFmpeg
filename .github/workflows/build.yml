name: Build Lean FFmpeg (Signature + HWAccel)

on:
  workflow_dispatch:
  push:
    branches: [ main,v1 ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # ---------- Linux (Ubuntu) ----------
      - name: Install build dependencies (Linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git libtool pkg-config \
            yasm nasm \
            libdrm-dev libva-dev \
            nvidia-cuda-toolkit

      - name: Configure FFmpeg (Linux + CUDA/NVENC)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          ./configure \
            --disable-everything \
            --enable-version3 \
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-demuxer=mov,mp4,mpegts \
            --enable-protocol=file \
            --enable-nvenc \
            --enable-cuda-nvcc \
            --enable-libnpp \
            --extra-cflags=-I/usr/include \
            --extra-ldflags=-L/usr/lib/x86_64-linux-gnu \
            --disable-doc

      # ---------- macOS ----------
      - name: Install build dependencies (macOS)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          brew install automake autoconf libtool pkg-config nasm

      - name: Configure FFmpeg (macOS + VideoToolbox)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          ./configure \
            --disable-everything \
            --enable-version3 \
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-demuxer=mov,mp4,mpegts \
            --enable-protocol=file \
            --enable-videotoolbox \
            --disable-doc

      # ---------- Windows ----------
      - name: Set up MSVC
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2
        if: ${{ matrix.os == 'windows-latest' }}
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            yasm
            nasm
            pkg-config
            zip

      - name: Configure FFmpeg (Windows MSVC)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          ./configure \
            --toolchain=msvc \
            --disable-everything \
            --enable-version3 \
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-demuxer=mov,mp4,mpegts \
            --enable-protocol=file \
            --disable-doc

      # ---------- Build (Linux) ----------
      - name: Build (Linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: make -j$(nproc)

      - name: Package (Linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          tar czf ffmpeg-${{ matrix.os }}.tar.gz ffmpeg ffprobe

      # ---------- Build (macOS) ----------
      - name: Build (macOS)
        if: ${{ matrix.os == 'macos-13' }}
        run: make -j$(sysctl -n hw.ncpu)

      - name: Package (macOS)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          tar czf ffmpeg-${{ matrix.os }}.tar.gz ffmpeg ffprobe

      # ---------- Build (Windows) ----------
      - name: Build (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          # MSYS2 provides nproc, use it for parallel make
          make -j$(nproc || echo 2)

      - name: Package (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          # Create a zip which is the common artifact on Windows
          if command -v zip >/dev/null 2>&1; then
            zip -r ffmpeg-${{ matrix.os }}.zip ffmpeg.exe ffprobe.exe
          else
            # fall back to tar (msys2 usually provides tar)
            tar czf ffmpeg-${{ matrix.os }}.tar.gz ffmpeg.exe ffprobe.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.os }}
          path: |
            ffmpeg-${{ matrix.os }}.tar.gz
            ffmpeg-${{ matrix.os }}.zip
