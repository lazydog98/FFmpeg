name: Build Lean FFmpeg (Signature + HWAccel)

on:
  workflow_dispatch:
  push:
    branches: [ main,v1 ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-latest]

    steps:
      - uses: actions/checkout@v4

      

      # ---------- macOS ----------
      - name: Install build dependencies (macOS)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          brew install automake autoconf libtool pkg-config nasm

      - name: Configure FFmpeg (macOS + VideoToolbox)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          ./configure \
            --disable-everything \
            --enable-version3 \
            --disable-everything \
            --enable-version3 \
            # Protocols
            --enable-protocol=pipe \
            # Muxers (outputs)
            --enable-muxer=null \
            --enable-muxer=mp4 \
            --enable-muxer=asf \
            --enable-muxer=matroska \
            # Demuxers (inputs)
            --enable-demuxer=mov,mp4,mpegts,asf,matroska \
            # Parsers
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=aac \
            # Decoders
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=aac \
            --enable-decoder=wmv1 \
            --enable-decoder=wmv2 \
            --enable-decoder=wmv3 \
            --enable-decoder=vc1 \
            --enable-decoder=wmav1 \
            --enable-decoder=wmav2 \
            --enable-decoder=wmapro \
            # Filters
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-filter=color \
            --enable-filter=testsrc \
            --enable-filter=testsrc2 \
            # Devices
            --enable-indev=lavfi \
            # Optional: minimal encoder for MP4 test output
            --enable-encoder=mpeg4 \
            #--enable-encoder=libx264 \
            #--enable-encoder=libx265 \
            --enable-videotoolbox \
            --disable-doc

      # macOS: shared build (dylib)
      - name: Configure FFmpeg (macOS shared)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          ./configure \
            --prefix=$(pwd)/out/macos/shared \
            --disable-everything \
            --enable-version3 \
            --enable-shared \
            # Protocols
            --enable-protocol=pipe \
            # Muxers (outputs)
            --enable-muxer=null \
            --enable-muxer=mp4 \
            --enable-muxer=asf \
            --enable-muxer=matroska \
            # Demuxers (inputs)
            --enable-demuxer=mov,mp4,mpegts,asf,matroska \
            # Parsers
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=aac \
            # Decoders
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=aac \
            --enable-decoder=wmv1 \
            --enable-decoder=wmv2 \
            --enable-decoder=wmv3 \
            --enable-decoder=vc1 \
            --enable-decoder=wmav1 \
            --enable-decoder=wmav2 \
            --enable-decoder=wmapro \
            # Filters
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-filter=color \
            --enable-filter=testsrc \
            --enable-filter=testsrc2 \
            # Devices
            --enable-indev=lavfi \
            # Optional: minimal encoder for MP4 test output
            --enable-encoder=mpeg4 \
            #--enable-encoder=libx264 \
            #--enable-encoder=libx265 \
            --enable-protocol=file \
            --enable-videotoolbox \
            --disable-static \
            --disable-doc

      # ---------- Windows ----------
      - name: Set up MSVC
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2
        if: ${{ matrix.os == 'windows-latest' }}
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            yasm
            nasm
            pkg-config
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Configure FFmpeg (Windows MSYS2/MinGW)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          # Use the MSYS2/MinGW GCC toolchain (avoid MSVC cl.exe issues)
          ./configure \
            --disable-everything \
            --enable-version3 \
            # Protocols
            --enable-protocol=pipe \
            # Muxers (outputs)
            --enable-muxer=null \
            --enable-muxer=mp4 \
            --enable-muxer=asf \
            --enable-muxer=matroska \
            # Demuxers (inputs)
            --enable-demuxer=mov,mp4,mpegts,asf,matroska \
            # Parsers
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=aac \
            # Decoders
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=aac \
            --enable-decoder=wmv1 \
            --enable-decoder=wmv2 \
            --enable-decoder=wmv3 \
            --enable-decoder=vc1 \
            --enable-decoder=wmav1 \
            --enable-decoder=wmav2 \
            --enable-decoder=wmapro \
            # Filters
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-filter=color \
            --enable-filter=testsrc \
            --enable-filter=testsrc2 \
            # Devices
            --enable-indev=lavfi \
            # Optional: minimal encoder for MP4 test output
            --enable-encoder=mpeg4 \
            #--enable-encoder=libx264 \
            #--enable-encoder=libx265 \
            --disable-doc \
            --arch=x86_64 \
            --enable-cross-compile


      # ---------- Build (macOS) ----------
      - name: Build (macOS)
        if: ${{ matrix.os == 'macos-13' }}
        run: make -j$(sysctl -n hw.ncpu)
      - name: Install (macOS static)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          make install DESTDIR=$(pwd)/out/macos/static || true

      - name: Strip (macOS static)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          if command -v strip >/dev/null 2>&1; then
            strip -x out/macos/static/usr/local/bin/ffmpeg || true
            strip -x out/macos/static/usr/local/bin/ffprobe || true
          fi

      

      - name: Package (macOS static)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          mkdir -p artifacts/macos/static
          cp out/macos/static/usr/local/bin/ffmpeg out/macos/static/usr/local/bin/ffprobe artifacts/macos/static/ || true
          tar czf ffmpeg-macos-static.tar.gz -C artifacts/macos/static .

      - name: Build (macOS shared)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          # configure already run for shared; build and install
          make -j$(sysctl -n hw.ncpu)
          make install DESTDIR=$(pwd)/out/macos/shared || true

      - name: Strip (macOS shared)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          if command -v strip >/dev/null 2>&1; then
            strip -x out/macos/shared/usr/local/bin/ffmpeg || true
            strip -x out/macos/shared/usr/local/bin/ffprobe || true
            find out/macos/shared -name "*.dylib" -exec strip -x {} \; || true
          fi

      

      - name: Package (macOS shared)
        if: ${{ matrix.os == 'macos-13' }}
        run: |
          mkdir -p artifacts/macos/shared
          cp -v out/macos/shared/usr/local/bin/ffmpeg out/macos/shared/usr/local/bin/ffprobe artifacts/macos/shared/ || true
          # copy dylibs
          find out/macos/shared -name "*.dylib" -exec cp -v {} artifacts/macos/shared/ \; || true
          tar czf ffmpeg-macos-shared.tar.gz -C artifacts/macos/shared .

      # ---------- Build (Windows) ----------
      - name: Build (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          # MSYS2 provides nproc, use it for parallel make
          make -j$(nproc || echo 2)

      - name: Install (Windows static)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          make install DESTDIR=$(pwd)/out/windows/static || true

      - name: Strip (Windows static)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          if command -v strip >/dev/null 2>&1; then
            strip out/windows/static/usr/local/bin/ffmpeg.exe || true
            strip out/windows/static/usr/local/bin/ffprobe.exe || true
          fi

      

      - name: Package (Windows static)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          mkdir -p artifacts/windows/static
          cp out/windows/static/usr/local/bin/ffmpeg.exe out/windows/static/usr/local/bin/ffprobe.exe artifacts/windows/static/ || true
            # Copy required DLLs
            cp /mingw64/bin/libiconv-2.dll /mingw64/bin/libwinpthread-1.dll /mingw64/bin/zlib1.dll artifacts/windows/static/ || true
          zip -r ffmpeg-windows-static.zip artifacts/windows/static || true

      - name: Build (Windows shared)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          # Reconfigure for shared libraries
          ./configure \
            --prefix=$(pwd)/out/windows/shared \
            --disable-everything \
            --enable-version3 \
            --enable-shared \
            --enable-indev=lavfi \
            --enable-filter=signature \
            --enable-filter=signature_cmp \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-demuxer=mov,mp4,mpegts \
            --enable-demuxer=asf \
            --enable-decoder=wmv1 \
            --enable-decoder=wmv2 \
            --enable-decoder=wmv3 \
            --enable-decoder=vc1 \
            --enable-decoder=wmav1 \
            --enable-decoder=wmav2 \
            --enable-decoder=wmapro \
            --enable-filter=color \
            --enable-filter=testsrc \
            --enable-filter=testsrc2 \
            --enable-protocol=file \
            --enable-muxer=mp4 \
            --enable-muxer=asf \
            --enable-muxer=matroska \
            --enable-encoder=mpeg4 \
            --enable-encoder=libx264 \
            --enable-encoder=libx265 \
            --arch=x86_64 \
            --enable-cross-compile
          make -j$(nproc || echo 2)
          make install DESTDIR=$(pwd)/out/windows/shared || true

      - name: Strip (Windows shared)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          if command -v strip >/dev/null 2>&1; then
            strip out/windows/shared/usr/local/bin/ffmpeg.exe || true
            strip out/windows/shared/usr/local/bin/ffprobe.exe || true
            find out/windows/shared -name "*.dll" -exec strip {} \; || true
          fi

      

      - name: Package (Windows shared)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          mkdir -p artifacts/windows/shared
          cp out/windows/shared/usr/local/bin/ffmpeg.exe out/windows/shared/usr/local/bin/ffprobe.exe artifacts/windows/shared/ || true
          # copy DLLs
          find out/windows/shared -name "*.dll" -exec cp -v {} artifacts/windows/shared/ \; || true
            # Copy required DLLs
            cp /mingw64/bin/libiconv-2.dll /mingw64/bin/libwinpthread-1.dll /mingw64/bin/zlib1.dll artifacts/windows/shared/ || true
          zip -r ffmpeg-windows-shared.zip artifacts/windows/shared || true

      - name: Package (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: msys2 {0}
        run: |
          # Create a zip which is the common artifact on Windows
          if command -v zip >/dev/null 2>&1; then
            zip -r ffmpeg-${{ matrix.os }}.zip ffmpeg.exe ffprobe.exe
          else
            # fall back to tar (msys2 usually provides tar)
            tar czf ffmpeg-${{ matrix.os }}.tar.gz ffmpeg.exe ffprobe.exe
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.os }}
          path: artifacts/**
